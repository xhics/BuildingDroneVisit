<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <style>
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <script>
    // Piloté depuis Python (simple_mode/cesium_render.py) via Playwright :
    // window.dronePrepare(config) charge la scène, puis window.droneSeek(i)
    // place la caméra sur le waypoint i et ne rend la main qu'une fois les
    // tuiles réellement chargées — sinon on capture de la géométrie floue ou
    // absente, ce qui est le piège classique de ce type de rendu.
    let viewer = null;
    let waypoints = [];

    window.droneReady = false;
    window.droneError = null;

    window.dronePrepare = async function (config) {
      try {
        waypoints = config.waypoints;

        // Aucun jeton Cesium ion : on ne consomme que les tuiles Google.
        viewer = new Cesium.Viewer("cesiumContainer", {
          baseLayer: false,
          baseLayerPicker: false,
          geocoder: false,
          homeButton: false,
          sceneModePicker: false,
          navigationHelpButton: false,
          animation: false,
          timeline: false,
          fullscreenButton: false,
          infoBox: false,
          selectionIndicator: false,
          // Rendu à la demande : en WebGL logiciel (headless sans GPU), une
          // boucle de rendu continue sature le processus et fait expirer les
          // captures d'écran. On pilote chaque image explicitement.
          requestRenderMode: true,
          maximumRenderTimeChange: Infinity,
          globe: false,           // les tuiles 3D fournissent le terrain
        });

        // Ciel et atmosphère : sans eux l'horizon est noir, ce qui trahit
        // immédiatement le rendu de synthèse sur les plans dégagés.
        viewer.scene.skyAtmosphere.show = true;

        // Heure de tournage. Attention à la portée réelle : les tuiles Google
        // sont photographiées puis texturées avec leur éclairage d'origine,
        // ombres comprises. Déplacer le soleil change donc le ciel et
        // l'atmosphère, mais **pas** l'éclairage des bâtiments — un vrai
        // passage en heure bleue ou de nuit relève de l'étalonnage, en aval.
        if (config.isoTime) {
          viewer.clock.currentTime = Cesium.JulianDate.fromIso8601(config.isoTime);
          viewer.clock.shouldAnimate = false;
        }

        // Le brouillard atmosphérique de Cesium délave les vues rasantes.
        viewer.scene.fog.enabled = false;

        const tileset = await Cesium.Cesium3DTileset.fromUrl(
          `https://tile.googleapis.com/v1/3dtiles/root.json?key=${config.apiKey}`,
          { showCreditsOnScreen: false }
        );
        viewer.scene.primitives.add(tileset);
        window.droneTileset = tileset;

        // Altitude du sol mesurée sur les tuiles elles-mêmes. L'API Google
        // Elevation renverrait une altitude au-dessus du géoïde (niveau de la
        // mer) alors que Cesium positionne la caméra au-dessus de
        // l'ellipsoïde WGS84 : à Mountain View l'écart atteint ~32 m, assez
        // pour transformer un vol rasant en vue d'horizon. Échantillonner la
        // scène rendue supprime l'ambiguïté de référentiel.
        const centre = Cesium.Cartographic.fromDegrees(config.centre.lon, config.centre.lat);

        // Cadrer le centre et rendre quelques images avant d'échantillonner :
        // sans cela la mesure porte sur des tuiles grossières et varie d'une
        // exécution à l'autre (écarts d'une quinzaine de mètres observés).
        viewer.camera.setView({
          destination: Cesium.Cartesian3.fromDegrees(config.centre.lon, config.centre.lat, 1000),
        });
        for (let i = 0; i < 30; i++) {
          viewer.scene.render();
          await new Promise((r) => setTimeout(r, 50));
        }

        // Échantillonner un seul point n'est pas déterministe : selon le
        // niveau de détail chargé, le rayon touche le sol, un toit ou un
        // arbre — écarts de 15 m constatés entre deux exécutions du même
        // rendu. On tire donc une couronne de points autour du sujet et on
        // en prend la médiane, robuste aux deux types d'aberration.
        const R = 6378137.0;
        const ring = [centre];
        for (const dist of [60, 120, 200, 300]) {
          for (const bearing of [0, 45, 90, 135, 180, 225, 270, 315]) {
            const a = (bearing * Math.PI) / 180;
            const dn = (dist * Math.cos(a)) / R;
            const de = (dist * Math.sin(a)) / (R * Math.cos((config.centre.lat * Math.PI) / 180));
            ring.push(
              Cesium.Cartographic.fromDegrees(
                config.centre.lon + (de * 180) / Math.PI,
                config.centre.lat + (dn * 180) / Math.PI
              )
            );
          }
        }

        // Points serrés sur le sujet : ils touchent le bâti, donc son sommet.
        const near = [centre];
        for (const dist of [15, 30]) {
          for (const bearing of [0, 60, 120, 180, 240, 300]) {
            const a = (bearing * Math.PI) / 180;
            const dn = (dist * Math.cos(a)) / R;
            const de = (dist * Math.sin(a)) / (R * Math.cos((config.centre.lat * Math.PI) / 180));
            near.push(
              Cesium.Cartographic.fromDegrees(
                config.centre.lon + (de * 180) / Math.PI,
                config.centre.lat + (dn * 180) / Math.PI
              )
            );
          }
        }

        let groundHeight = 0;
        let topHeight = 0;
        try {
          const sampled = await viewer.scene.sampleHeightMostDetailed([...ring, ...near]);
          const ringH = sampled
            .slice(0, ring.length)
            .filter((c) => c && Number.isFinite(c.height))
            .map((c) => c.height)
            .sort((x, y) => x - y);
          const nearH = sampled
            .slice(ring.length)
            .filter((c) => c && Number.isFinite(c.height))
            .map((c) => c.height)
            .sort((x, y) => x - y);

          if (ringH.length) {
            // Le sol est la surface basse : une médiane mêlerait toitures et
            // arbres au terrain. Un quantile bas isole le sol réel.
            groundHeight = ringH[Math.floor(ringH.length * 0.2)];
            window.droneGroundSource = `quantile 20% de ${ringH.length} points`;
          } else {
            window.droneGroundSource = "echec echantillonnage";
          }
          // Le sommet du bâti est la surface haute près du sujet ; un quantile
          // haut évite qu'un arbre isolé ne fasse la mesure.
          topHeight = nearH.length ? nearH[Math.floor(nearH.length * 0.8)] : groundHeight;
        } catch (e) {
          window.droneGroundSource = "erreur: " + String(e && e.message ? e.message : e);
        }
        window.droneGroundHeight = groundHeight;
        window.droneTopHeight = topHeight;
        window.droneReady = true;
      } catch (err) {
        window.droneError = String(err && err.message ? err.message : err);
      }
    };

    // Attend que les tuiles visibles depuis la pose courante soient chargées.
    // `tilesLoaded` peut basculer à true trop tôt sur une caméra qui vient de
    // bouger : on exige donc plusieurs rendus consécutifs sans requête en
    // attente avant de considérer la vue comme stable.
    function waitForTiles(timeoutMs) {
      return new Promise((resolve) => {
        const started = Date.now();
        let stableFrames = 0;
        function step() {
          viewer.scene.render();
          const pending = window.droneTileset.tilesLoaded ? 0 : 1;
          stableFrames = pending === 0 ? stableFrames + 1 : 0;
          // 4 images stables suffisent à confirmer que le chargement est
          // terminé ; au-delà on ne fait que payer des rendus 1080p inutiles,
          // et le coût dominant est déjà le transfert des tuiles.
          if (stableFrames >= 4 || Date.now() - started > timeoutMs) {
            resolve(stableFrames >= 4);
            return;
          }
          requestAnimationFrame(step);
        }
        step();
      });
    }

    window.droneSeek = async function (index, timeoutMs) {
      const w = waypoints[index];
      // `agl` = hauteur au-dessus du sol ; le référentiel absolu est ajouté
      // ici à partir de la mesure faite sur les tuiles.
      const height = window.droneGroundHeight + w.agl;
      viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(w.lon, w.lat, height),
        orientation: {
          heading: Cesium.Math.toRadians(w.heading),
          pitch: Cesium.Math.toRadians(w.pitch),
          roll: 0.0,
        },
      });
      return await waitForTiles(timeoutMs || 15000);
    };
  </script>
</body>
</html>
