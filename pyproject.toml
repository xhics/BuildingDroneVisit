[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotel-pipeline"
version = "0.1.0"
description = "Reconstruction d'environnements 3D d'hôtels à partir d'une adresse — Phase 1"
# 3.11 est la version de référence, fixée par l'image Docker (runtime reproductible).
# 3.12 est tolérée pour le développement local ; 3.13+ ne l'est pas, les roues
# torch/pycolmap de la couche vision n'y étant pas disponibles.
requires-python = ">=3.11,<3.13"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "diskcache>=5.6",
    "requests>=2.31",
    "shapely>=2.0",
    "Pillow>=10.0",
    "ImageHash>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Couche vision — installée dans l'image GPU (Lot 2), pas sur le poste local.
# Chaque bibliothèque remplace du code qu'il aurait fallu écrire et calibrer.
vision = [
    "open_clip_torch>=2.24",   # classification zero-shot, sans entraînement
    "cleanvision>=0.3",        # flou, exposition, quasi-doublons, images vides
    "imagededup>=0.3",         # déduplication perceptuelle et CNN
    "pyiqa>=0.1.10",           # qualité sans référence (BRISQUE, NIQE, MUSIQ)
    "google-cloud-vision>=3.7",  # OCR d'enseigne, détection web
    "googlemaps>=4.10",        # client officiel Places
]

[project.scripts]
hotel-pipeline = "hotel_pipeline.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
