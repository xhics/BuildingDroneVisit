[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotel-pipeline"
version = "0.1.0"
description = "Reconstruction d'environnements 3D d'hôtels à partir d'une adresse — Phase 1"
# 3.11 est la version de référence, fixée par l'image Docker (runtime reproductible).
# 3.12 est tolérée pour le développement local ; 3.13+ ne l'est pas, les roues
# torch/pycolmap de la couche vision n'y étant pas disponibles.
requires-python = ">=3.11,<3.13"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "diskcache>=5.6",
    "requests>=2.31",
    "shapely>=2.0",
    "Pillow>=10.0",
    "ImageHash>=4.3",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Couche vision — cible : image GPU (Lot 2). Chaque bibliothèque remplace du
# code qu'il aurait fallu écrire et calibrer.
vision = [
    "open_clip_torch>=2.24",   # classification zero-shot, sans entraînement
    "easyocr>=1.7",            # OCR d'enseigne, local et gratuit
    "cleanvision>=0.3",        # flou, exposition, quasi-doublons, images vides
    "imagededup>=0.3",         # déduplication perceptuelle et CNN
    "pyiqa>=0.1.10",           # qualité sans référence (BRISQUE, NIQE, MUSIQ)
]

# Couche géospatiale. Aucune dépendance système : lazrs décompresse le LAZ
# sans LASzip, et pyproj embarque PROJ dans sa roue.
geo = [
    "laspy[lazrs]>=2.5",   # lecture LAZ
    "pyproj>=3.6",         # reprojection WGS84 vers le référentiel de la tuile
    "rasterio>=1.4",       # écriture des GeoTIFF dérivés
    "scipy>=1.11",         # triangulation TIN et recherche du plus proche voisin
]

# Reconstruction sparse et localisation 2D-3D. HLoc/LightGlue reste installé
# depuis le clone officiel figé dans l'image GPU ; ces deux roues suffisent à
# relire ses artefacts et à exécuter un PnP sans fallback de pose.
sfm = [
    "pycolmap>=3.11,<4",
    "h5py>=3.10",
]

# Poste local Mac Intel uniquement. torch 2.2.2 est la dernière version
# compilée pour x86_64 macOS et exige NumPy 1, tandis qu'OpenCV 5 et tifffile
# exigent NumPy 2 : sans ces bornes, chaque installation recasse l'autre.
# La VM GPU (Linux) n'a pas cette contrainte et n'utilise pas cet extra.
vision-macos-intel = [
    "torch==2.2.2",
    "torchvision==0.17.2",
    "numpy<2",
    "scipy<1.15",
    "opencv-python-headless<4.11",
    "tifffile<2025",
    "scikit-image<0.25",
    # pyproj 3.7 n'a pas de roue x86_64 macOS et exige PROJ pour compiler.
    "pyproj==3.6.1",
    # Les roues Intel de rasterio 1.4.4 et 1.5 exigent macOS 15 ; cette
    # machine est sous macOS 12. La 1.4.3 fournit une roue macosx_10_15.
    "rasterio==1.4.3",
]

# OCR par service, uniquement en repli si EasyOCR est indisponible.
vision-cloud = ["google-cloud-vision>=3.7"]

# Détection ouverte CPU/GPU via l'API officielle Hugging Face. SAM 2 reste
# dans l'image GPU Linux : sa version courante exige torch>=2.5.1 et ne doit
# pas forcer la mise à niveau du verrou Mac Intel torch==2.2.2.
semantic-vision = [
    "transformers>=4.40,<5",
]

[project.scripts]
hotel-pipeline = "hotel_pipeline.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
